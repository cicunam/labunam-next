# Despliega en el servidor de desarrollo cada cambio que llega a master.
name: Despliegue en desarrollo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Las mezclas seguidas se despliegan en orden; ninguna cancela a la que ya está en curso.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Construir y activar en desarrollo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # El script viaja desde este commit, así un cambio en él aplica en el mismo despliegue.
      - name: Desplegar
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEV_SSH_USER@$DEV_SSH_HOST" "bash -s -- $GITHUB_SHA" < scripts/deploy.sh
